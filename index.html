<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }
        .roulette { font-size: 80px; margin: 20px; border: 5px solid #ffd700; padding: 20px; border-radius: 20px; }
        .spinning { animation: spin 0.5s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        button { padding: 15px 30px; font-size: 20px; background: #ffd700; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="roulette" id="slots">🎰</div>
    <button id="spinBtn">КРУТИТЬ!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        const slots = document.getElementById('slots');

        document.getElementById('spinBtn').onclick = () => {
            slots.classList.add('spinning');
            // Эмулируем анимацию 2 секунды
            setTimeout(() => {
                slots.classList.remove('spinning');
                tg.sendData(JSON.stringify({ "action": "spin" }));
            }, 2000);
        };
    </script>
</body>
</html>
