<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; }
        .slots { font-size: 50px; margin: 20px; }
        button { padding: 15px 30px; font-size: 20px; border-radius: 15px; border: none; background: #ffd700; cursor: pointer; }
    </style>
</head>
<body>
    <h1>ТГ Казино</h1>
    <div class="slots" id="slots">❓ ❓ ❓</div>
    <button id="spinBtn">Крутить (10 credits)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        document.getElementById('spinBtn').onclick = () => {
            // Отправляем запрос на сервер (в нашем случае — в бота)
            tg.sendData(JSON.stringify({ action: "spin" }));
        };
    </script>
</body>
</html>
