<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }
        button { padding: 20px 40px; font-size: 24px; cursor: pointer; background: #ffd700; border: none; border-radius: 10px; }
    </style>
</head>
<body>
    <button id="spin">КРУТИТЬ!</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно на весь экран

        document.getElementById('spin').onclick = function() {
            // Проверка, что JS вообще сработал
            console.log("Кнопка нажата!");
            
            // Отправка данных боту
            tg.sendData(JSON.stringify({ "action": "spin" }));
        };
    </script>
</body>
</html>
