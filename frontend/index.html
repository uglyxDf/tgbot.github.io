<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        button { padding: 15px 30px; font-size: 18px; border-radius: 10px; border: none; background: #2678b6; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <button id="mainBtn">Сделать заказ!</button>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        document.getElementById('mainBtn').onclick = () => {
            // Отправляем данные обратно в бота
            tg.sendData(JSON.stringify({
                action: "order",
                item: "Товар №1",
                user_id: tg.initDataUnsafe.user?.id
            }));
            tg.close(); // Закрываем окно после нажатия
        };
    </script>
</body>
</html>
